# Throwaway Postgres for end-to-end tests. Data lives in memory and is lost on stop.
services:
  db:
    image: postgres:18
    environment:
      POSTGRES_USER: grabit
      POSTGRES_PASSWORD: grabit
      POSTGRES_DB: grabit_test
    ports:
      - '5433:5432'
    tmpfs:
      - /var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U grabit -d grabit_test']
      interval: 1s
      timeout: 3s
      retries: 30
