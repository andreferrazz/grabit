# Throwaway services for end-to-end tests. Nothing here persists across a restart.
services:
  db:
    image: postgres:18
    environment:
      POSTGRES_USER: grabit
      POSTGRES_PASSWORD: grabit
      POSTGRES_DB: grabit_test
    ports:
      - '54331:5432'
    tmpfs:
      - /var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U grabit -d grabit_test']
      interval: 1s
      timeout: 3s
      retries: 30

  # Catches the mail the app sends, so tests can read it over HTTP on port 54333.
  mail:
    image: axllent/mailpit:latest
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: '1'
      MP_SMTP_AUTH_ALLOW_INSECURE: '1'
    ports:
      - '54332:1025'
      - '54333:8025'
